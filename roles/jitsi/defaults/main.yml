---
jitsi_version: stable-11248-2
jitsi_base_dir: /opt/jitsi-meet
jitsi_config_dir: /opt/jitsi-meet-cfg
jitsi_project_name: jitsi
jitsi_container_uid: 1000
jitsi_public_url: ""
jitsi_advertise_ips: ""
jitsi_tz: UTC
jitsi_http_port: 8000
jitsi_https_port: 8443
jitsi_enable_recording: true
jitsi_enable_auth: false

# Jibri recordings cleanup, works with jitsi_enable_recording: true - Автоочистка записей Jibri, работает при jitsi_enable_recording: true
# A recording is deleted when it is too old or the total size is over the limit - Запись удаляется, если она старше срока или все записи вместе больше лимита
# Over the limit the oldest go first; a recording in progress is never touched - Сверх лимита удаляются самые старые; идущую запись очистка не трогает
jitsi_recordings_dir: "{{ jitsi_config_dir }}/storage/jibri/recordings"
jitsi_recordings_retention_days: 30
jitsi_recordings_max_total_size_gb: 15
# When to run the cleanup, cron fields: minute and hour - Когда запускать очистку, поля cron: минута и час
# Every 15 minutes: minute "*/15", hour "*" - Каждые 15 минут: minute "*/15", hour "*"
# Daily at 04:00: minute "0", hour "4" - Раз в сутки в 04:00: minute "0", hour "4"
jitsi_recordings_cleanup_minute: "*/15"
jitsi_recordings_cleanup_hour: "*"
# Extra variables for .env, e.g. {ENABLE_LOBBY: 1} - Дополнительные переменные для .env, например {ENABLE_LOBBY: 1}
jitsi_extra_env: {}
