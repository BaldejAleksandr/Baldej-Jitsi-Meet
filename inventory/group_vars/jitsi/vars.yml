---
# Основные настройки Jitsi. Рядом:
#   site.yml                 — данные вашего сервера (URL), не в git; пример: site.yml.example
#   vault.yml                — пароли сервисов (ansible-vault), не в git; пример: vault.yml.example
#   plugins/recordings.yml   — запись конференций и автоочистка записей
#   plugins/file_sharing.yml — обмен файлами в чате
jitsi_version: stable-11248-2
jitsi_advertise_ips: "{{ ansible_host }}"
jitsi_tz: UTC

# Jitsi слушает HTTP на этом порту; HTTPS делает обратный прокси перед ним
# (например, Nginx Proxy Manager: https://meet.example.com -> http://<IP сервера>:8000)
jitsi_http_port: 8000
jitsi_https_port: 8443

# Секреты лежат в vault.yml (ansible-vault)
jitsi_jicofo_auth_password: "{{ vault_jitsi_jicofo_auth_password }}"
jitsi_jvb_auth_password: "{{ vault_jitsi_jvb_auth_password }}"
jitsi_jigasi_xmpp_password: "{{ vault_jitsi_jigasi_xmpp_password }}"
jitsi_jigasi_transcriber_password: "{{ vault_jitsi_jigasi_transcriber_password }}"
jitsi_jibri_recorder_password: "{{ vault_jitsi_jibri_recorder_password }}"
jitsi_jibri_xmpp_password: "{{ vault_jitsi_jibri_xmpp_password }}"
