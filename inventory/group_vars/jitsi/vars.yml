---
# Core Jitsi settings. Next to this file - Основные настройки Jitsi. Рядом с этим файлом:
#   site.yml                 - your server URL, not in git, see site.yml.example - адрес вашего сервера, не в git, пример: site.yml.example
#   vault.yml                - service passwords (ansible-vault), not in git - пароли сервисов (ansible-vault), не в git
#   plugins/recordings.yml   - recording and recordings cleanup - запись конференций и автоочистка записей
#   plugins/file_sharing.yml - file sharing in chat - обмен файлами в чате
jitsi_version: stable-11248-2
jitsi_advertise_ips: "{{ ansible_host }}"
jitsi_tz: UTC

# Jitsi listens for HTTP on this port; a reverse proxy in front adds HTTPS - Jitsi слушает HTTP на этом порту; HTTPS делает обратный прокси перед ним
# E.g. Nginx Proxy Manager: https://meet.example.com -> http://<server IP>:8000 - Например, Nginx Proxy Manager: https://meet.example.com -> http://<IP сервера>:8000
jitsi_http_port: 8000
jitsi_https_port: 8443

# Secrets live in vault.yml (ansible-vault) - Секреты лежат в vault.yml (ansible-vault)
jitsi_jicofo_auth_password: "{{ vault_jitsi_jicofo_auth_password }}"
jitsi_jvb_auth_password: "{{ vault_jitsi_jvb_auth_password }}"
jitsi_jigasi_xmpp_password: "{{ vault_jitsi_jigasi_xmpp_password }}"
jitsi_jigasi_transcriber_password: "{{ vault_jitsi_jigasi_transcriber_password }}"
jitsi_jibri_recorder_password: "{{ vault_jitsi_jibri_recorder_password }}"
jitsi_jibri_xmpp_password: "{{ vault_jitsi_jibri_xmpp_password }}"
